name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build, for example v1.7.0"
        required: true
        type: string

permissions:
  contents: write

env:
  SOLUTION_PATH: FFGUIToolAvalonia.sln
  DOTNET_VERSION: 8.0.x
  RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Check release metadata
        shell: pwsh
        run: ./scripts/release-check.ps1

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build

  package-windows:
    name: Package Windows
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Publish Windows packages
        shell: pwsh
        run: .\publish.ps1 -Windows -Installer

      - name: Upload Windows x64 portable archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: FFGUITool/bin/publish/archives/*-windows-x64-Portable.zip
          if-no-files-found: error

      - name: Upload Windows x86 portable archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86-portable
          path: FFGUITool/bin/publish/archives/*-windows-x86-Portable.zip
          if-no-files-found: error

      - name: Upload Windows arm64 portable archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-portable
          path: FFGUITool/bin/publish/archives/*-windows-arm64-Portable.zip
          if-no-files-found: error

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: FFGUITool/bin/publish/installer/*-windows-x64-Installer.exe
          if-no-files-found: error

      - name: Upload Windows x86 installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86-installer
          path: FFGUITool/bin/publish/installer/*-windows-x86-Installer.exe
          if-no-files-found: error

      - name: Upload Windows arm64 installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-installer
          path: FFGUITool/bin/publish/installer/*-windows-arm64-Installer.exe
          if-no-files-found: error

  package-macos:
    name: Package macOS
    runs-on: macos-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish macOS packages
        shell: bash
        run: |
          chmod +x ./publish.sh
          ./publish.sh -macos --dmg

      - name: Upload macOS Intel portable archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-portable
          path: FFGUITool/bin/publish/archives/*-macos-intel-Portable.zip
          if-no-files-found: error

      - name: Upload macOS arm64 portable archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-portable
          path: FFGUITool/bin/publish/archives/*-macos-arm64-Portable.zip
          if-no-files-found: error

      - name: Upload macOS Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-installer
          path: FFGUITool/bin/publish/dmg/*-macos-intel-Installer.dmg
          if-no-files-found: error

      - name: Upload macOS arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-installer
          path: FFGUITool/bin/publish/dmg/*-macos-arm64-Installer.dmg
          if-no-files-found: error

  package-linux:
    name: Package Linux
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Linux packages
        shell: bash
        run: |
          chmod +x ./publish.sh
          ./publish.sh -linux

      - name: Upload Linux x64 portable archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-portable
          path: FFGUITool/bin/publish/archives/*-linux-x64-Portable.zip
          if-no-files-found: error

      - name: Upload Linux arm64 portable archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-portable
          path: FFGUITool/bin/publish/archives/*-linux-arm64-Portable.zip
          if-no-files-found: error

  upload-release-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs:
      - package-windows
      - package-macos
      - package-linux

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release assets
        shell: bash
        run: |
          mkdir -p dist
          while IFS= read -r file; do
            name="$(basename "$file")"
            if [[ -e "dist/$name" ]]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            cp "$file" "dist/$name"
          done < <(find release-assets -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' \) | sort)
          find dist -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
